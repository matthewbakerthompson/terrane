view_id: domain-landscape
title: "{domain} — Landscape"
category: Application
section: Landscape
kind: diagram
up: application-landscape
description: >
  One business domain and its immediate neighbors: every system in the domain
  plus everything one interface away. Smaller and easier to read than the full
  landscape, and drawn for every domain the systems name.
layout: LR
group_by: company_domain
renderers: [mermaid]

# A domain is a word on the systems, not a record of its own, so the subject
# is a value of the field. It used to be one view per domain, written for
# Servicing, which an estate with no Servicing domain could not draw.
parameters:
  - name: domain
    field: company_domain
    required: true
    description: The business domain this landscape is about

scope:
  include:
    - type: systems
      where:
        company_domain: ["{domain}"]
        status: [Active, Planned]
  expand:
    - relation: interfaces
      depth: 1
      types: [systems]

edges:
  - via: interfaces
    label: protocol
  - via: system_realizes_capability
    text: realizes

style:
  color_by: criticality

limits:
  max_nodes: 30

# One committed drawing per domain the current and planned systems name; a
# ninth domain gets its landscape the day a system names it.
render_for:
  parameter: domain
  type: systems
  field: company_domain
  where:
    status: [Active, Planned]
