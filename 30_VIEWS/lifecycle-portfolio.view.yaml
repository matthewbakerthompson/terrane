view_id: lifecycle-portfolio
title: Portfolio Lifecycle
category: Application
section: Landscape
kind: map
description: >
  Systems grouped by lifecycle status and shaded by criticality. Check the
  Planned and Deprecated columns: what is arriving that nothing depends on
  yet, and what is leaving that other systems still depend on.
layout: LR
node_label: name
renderers: [mermaid]

group_by: status

scope:
  include:
    - type: systems

edges:
  - via: interfaces

style:
  color_by: criticality

limits:
  # Raised from 50 at 88 systems. Cut by id, the map lost five products'
  # planned systems, the arrivals it is there to show, and two active
  # ones; a map is scanned, and all 88 pack into three bands.
  max_nodes: 120
