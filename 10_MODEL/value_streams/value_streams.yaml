  togaf_layer: Business
  architecture_domain: Business
  abstraction_level: Conceptual
  value_stream_type: Core
  stakeholders: Depositor;Deposit broker;Treasury;Compliance
  value_proposition: A saver opens a CD or savings account — directly or through a broker — funds it without friction, and is paid accurately at maturity. This stream is also how the bank funds its lending.
  owner_org_id: ORG-DEPOSITS
  last_reviewed: 2026-08-22
  source: Business architecture repository

