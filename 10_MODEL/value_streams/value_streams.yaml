# Value streams: how the enterprise actually delivers something someone wants.
#
# Imported from the business architecture repository. A value stream is not a
# process: it is stated from the point of view of whoever receives the value,
# and it ends when they have it.

- value_stream_id: VS-ACQUIRE-CUSTOMER
  name: Prospect to Funded Account
  description: A qualified applicant receives an actionable credit decision quickly and compliantly, and can transact within days.
  status: Proposed
  togaf_layer: Business
  architecture_domain: Business
  abstraction_level: Conceptual
  value_stream_type: Core
  stakeholders: Prospective cardholder;Marketing;Credit Risk;Compliance
  value_proposition: A qualified applicant receives an actionable credit decision quickly and compliantly, and can transact within days.
  owner_org_id: ORG-ORIG
  last_reviewed: 2026-08-17
  source: Business architecture repository

