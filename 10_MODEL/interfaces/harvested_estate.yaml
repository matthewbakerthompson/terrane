# How the systems the business layer harvested talk to each other, and to
# the estate this model already held.
#
# The harvested systems arrived as names with nothing between them: the
# process map said which systems each process uses, and nothing said how a
# payment reaches the ledger or a bureau file leaves it. These are the
# connections, drafted from two sources: the pairs of systems the process
# inventory uses together (the ledger and the document platform share ten
# processes, the collections platform and the general ledger four), and the
# patterns in `27_PATTERNS/` that say how a connection of each kind is built
# here. Every interface names the pattern it applies, which is what makes
# "did this integration use the approved pattern" a query.
#
# Everything here is Proposed, like the systems at either end: drafted from
# the process map and the pattern library, not confirmed by anyone who runs
# one. To promote one, move it to the file of the product that owns it and
# set its status. The payload rows are in
# `10_MODEL/relations/harvested_estate.yaml`.

