# Imported from tech_services.csv. Reference set: these change as a group, so
# they share a file. Edit freely; the importer will not overwrite.
#
# `landing-zone` on a service says a part may resolve to it: a part that
# asks for an api-gateway on an Azure shape finds APIM here without the
# shape binding it. The per-product network primitives in the AWS files
# are of the same kinds and are not tagged, so a part asking for the
# private egress finds PrivateLink and not a NAT gateway.

