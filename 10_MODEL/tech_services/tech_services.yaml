- tech_service_id: TS-AZURE-KEYVAULT
  name: Azure Key Vault
  description: Secret, key and certificate management.
  status: Active
  togaf_layer: Technology
  architecture_domain: Technology
  company_domain: Enterprise Platform
  owner_org_id: ORG-TECH
  provider: Microsoft Azure
  cloud_provider: Azure
  service_category: Security
  service_name: Key Vault
  component_type: secrets-manager
  # One service that is two kinds: Key Vault holds the keys as well as the
  # secrets, so it answers for `kms` on this landing zone too. Until it said
  # so, a part asking for a kms on Azure resolved to nothing and the product
  # shape bound Key Vault by hand.
  answers_for: [kms]
  tags: [landing-zone]

