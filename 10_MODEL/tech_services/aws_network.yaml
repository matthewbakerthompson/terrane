# The network fabric. Modeled by hand rather than by the onboarding archetype
# on purpose: account-level networking is provisioned by the landing zone, not
# by the product team, and in a real estate several products share a VPC. An
# archetype that vended a VPC per product would be describing a different
# operating model from the one this estate actually runs.
#
# Subnets are per availability zone, which is what makes a multi-AZ diagram
# drawable without duplicating every system once per zone.

