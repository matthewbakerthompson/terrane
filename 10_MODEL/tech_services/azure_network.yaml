    subnets:
      - {id: PUB, name: Public Subnet, zone: Public, az: zone-redundant}
      - {id: APP, name: App Subnet, zone: Private-App, az: zone-redundant}
      - {id: SHARED, name: Shared Services Subnet, zone: Shared-Services, az: zone-redundant}
    nat_gateways:
