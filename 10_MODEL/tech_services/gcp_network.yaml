# The Google Cloud network estate, tagged `network-fabric` so the topology
# view draws it beside AWS's: the two paths back to the data center, the hub
# every spoke attaches to, and the lending workload's tiers as subnetworks of
# the shared VPC. Google's network is shaped differently from AWS's and the
# model says so rather than borrowing: one VPC, global, shared from a host
# project; regional subnetworks rather than zonal subnets; a proxy-only
# subnetwork for the load balancer's own address space; Cloud NAT for the
# egress AWS does with a gateway per zone.
- tech_service_id: TS-GCPNET-HA-VPN
  name: HA VPN
  service_name: HA VPN
  component_type: hybrid-link
  description: >
    The backup path to the data center: HA VPN over the internet, two tunnels
    with BGP, carrying the traffic when the Interconnect does not. Tested on
    the same quarterly failover as the Interconnect's second attachment.
  status: Active
  provider: Google Cloud
  service_category: Network
  owner_org_id: ORG-TECH
  cloud_provider: GCP
  cloud_account: gcp-shared-network
  region: europe-west2
  network_zone: Shared-Services
  company_domain: Enterprise Platform
  togaf_layer: Technology
  architecture_domain: Technology
  tags: [network-fabric, landing-zone]
- tech_service_id: TS-GCPNET-PROXY-SUB-LEND
  name: Lending Proxy-only Subnetwork
  service_name: Subnetwork
  component_type: subnet
  description: >
    The proxy-only subnetwork the regional external load balancer's proxies
    sit in; nothing of ours runs there, and nothing of ours may.
  status: Active
  provider: Google Cloud
  service_category: Network
  owner_org_id: ORG-TECH
  cloud_provider: GCP
  cloud_account: gcp-lending-prod
  region: europe-west2
  network_zone: Public
  cidr: 10.60.0.0/23
  company_domain: Lending
  togaf_layer: Technology
  architecture_domain: Technology
  tags: [network-fabric]
