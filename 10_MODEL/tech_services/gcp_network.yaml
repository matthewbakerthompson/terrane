  name: Lending App Subnetwork
  service_name: Subnetwork
  component_type: subnet
  description: >
    Where the GKE nodes land. Regional, shared to the lending project from the
    host project, so the zones are the cluster's to spread across.
  status: Active
  provider: Google Cloud
  service_category: Network
  owner_org_id: ORG-TECH
  cloud_provider: GCP
  cloud_account: gcp-lending-prod
  region: europe-west2
