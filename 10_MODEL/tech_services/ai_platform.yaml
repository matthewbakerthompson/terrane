# The foundation model service of each landing zone, tagged `landing-zone` so
# a part that asks for one (the inference service in 28_MODULES/) resolves to
# it without the shape binding it. Named as the clouds name them in 2026;
# the models behind each are the provider's own families and the third-party
# ones it hosts, which change too often to list here.

- tech_service_id: TS-AWS-BEDROCK
  name: Amazon Bedrock
  description: Managed access to foundation models (Amazon Nova, Claude, Llama and others) inside the account's own data boundary.
  status: Active
  togaf_layer: Technology
  architecture_domain: Technology
  company_domain: Enterprise Platform
  owner_org_id: ORG-TECH
  provider: AWS
  cloud_provider: AWS
  service_category: AI
  service_name: Bedrock
  component_type: foundation-model-service
  tags: [landing-zone]

