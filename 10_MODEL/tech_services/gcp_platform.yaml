# The Google Cloud landing zone: the services every workload project gets
# whether or not anybody asked for them, tagged `landing-zone` so a shape's
# blocks resolve against them by kind. The third cloud, and the same kinds as
# the AWS and Azure zones, which is the library's claim made good: the parts
# are the same, the bindings differ. A landing zone names one service per
# kind, so Pub/Sub carries the queue and Managed Service for Apache Kafka the
# stream.
- tech_service_id: TS-GCP-GKE
  name: Google Kubernetes Engine
  description: Managed Kubernetes for the containerized estate on Google Cloud, an Autopilot cluster per workload project.
  status: Active
  togaf_layer: Technology
  architecture_domain: Technology
  company_domain: Enterprise Platform
  owner_org_id: ORG-TECH
  provider: Google Cloud
  cloud_provider: GCP
  service_category: Compute
  service_name: GKE
  component_type: container-platform
  tags: [landing-zone]
