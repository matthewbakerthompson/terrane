  - system_id: SYS-LENDING-API
    tech_service_id: TS-NET-SUB-LEND-APP-A
  - system_id: SYS-LENDING-API
    tech_service_id: TS-NET-SUB-LEND-APP-B
  - system_id: SYS-LENDING-WORKER
    tech_service_id: TS-NET-SUB-LEND-APP-A
  - system_id: SYS-LENDING-WORKER
    tech_service_id: TS-NET-SUB-LEND-APP-B
  - system_id: SYS-LENDING-DB
    tech_service_id: TS-NET-SUB-LEND-DATA-A
  - system_id: SYS-LENDING-DB
