# What the harvested estate carries, reads, enforces and is used by.
#
# The business layer brought thirty-three systems and ten data assets across
# as names. The interfaces between them are in
# `10_MODEL/interfaces/harvested_estate.yaml`; these are the facts that make
# those interfaces mean something: which data asset each one carries, which
# systems hold which data, which control each system enforces, who uses it,
# and the few places a harvested system runs on a technology service this
# model already holds.
#
# Drafted from the process inventory and the pattern library, like the
# interfaces, and as unconfirmed. A row here is a claim for the owner of the
# system to confirm or strike, which is a better starting point than the
# empty inspector the harvested systems had.

