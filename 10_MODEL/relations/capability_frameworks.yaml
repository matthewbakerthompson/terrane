# Which body of practice each capability domain answers to.
#
# Mapped at level 0 only. Below that the answer is the parent's: a level-1
# capability inside Payments answers to PCI DSS because Payments does, and
# repeating it on every child would be noise that then goes stale unevenly.
#
# `alignment` is the part worth arguing about:
#
#   Governed by  a fact about the organization. An auditor turns up.
#   Aligned to   a choice somebody made and can revisit.
#   Informed by  a borrowing. Useful vocabulary, no obligation.
#
# A domain with no mapping is not an oversight to be filled in for tidiness.
# It means no external body of practice has much to say about it, which is
# itself worth knowing.

capability_aligns_to_framework:
  # --- what the bank does: BIAN is the reference model -------------------
  - capability_id: CAP-PAY
    framework_id: FW-BIAN
    alignment: Aligned to
  - capability_id: CAP-PAY
    framework_id: FW-PCI-DSS
    alignment: Governed by
  - capability_id: CAP-MERCH
    framework_id: FW-BIAN
    alignment: Aligned to
  - capability_id: CAP-MERCH
    framework_id: FW-PCI-DSS
    alignment: Governed by
  - capability_id: CAP-ORIG
    framework_id: FW-BIAN
    alignment: Aligned to
  - capability_id: CAP-CRED
    framework_id: FW-BIAN
    alignment: Aligned to
  - capability_id: CAP-SERV
    framework_id: FW-BIAN
    alignment: Aligned to
  - capability_id: CAP-BILL
    framework_id: FW-BIAN
    alignment: Aligned to
  - capability_id: CAP-COLL
    framework_id: FW-BIAN
    alignment: Aligned to
  - capability_id: CAP-FRAUD
    framework_id: FW-BIAN
    alignment: Aligned to
  - capability_id: CAP-FRAUD
