# Who is outside the estate looking in.
#
# Deliberately coarse. A context diagram with twenty actor types is not a
# context diagram, it is a landscape with people drawn on it. These are the
# parties whose needs actually shape the architecture: if removing one would
# not change a design decision, it does not belong here.

- actor_id: ACT-CARDHOLDER
  name: Cardholder
  description: >
    The customer. Uses the self-service channels, and is the reason the
    authorization path has a latency budget rather than a throughput one.
  status: Active
  actor_kind: Person
  internal: "No"
  volume: ~2.4M active accounts
  company_domain: Servicing
  togaf_layer: Business
  architecture_domain: Business

- actor_id: ACT-APPLICANT
  name: Loan Applicant
  description: A prospect applying for installment credit, not yet a customer.
  status: Active
  actor_kind: Person
  internal: "No"
  company_domain: Lending
  togaf_layer: Business
  architecture_domain: Business

- actor_id: ACT-SERVICING-AGENT
  name: Servicing Agent
  description: Contact center staff handling balance, dispute and account queries.
  status: Active
  actor_kind: Role
  internal: "Yes"
  owner_org_id: ORG-SERVICING
  volume: ~450 seats
  company_domain: Servicing
  togaf_layer: Business
  architecture_domain: Business

- actor_id: ACT-COLLECTIONS-AGENT
  name: Collections Agent
  description: Handles arrears treatment and payment arrangements.
  status: Active
  actor_kind: Role
  internal: "Yes"
  owner_org_id: ORG-COLLECTIONS
  company_domain: Collections
  togaf_layer: Business
  architecture_domain: Business

- actor_id: ACT-UNDERWRITER
  name: Credit Underwriter
  description: Reviews referred applications the automated decision would not take.
  status: Active
  actor_kind: Role
  internal: "Yes"
  owner_org_id: ORG-CREDIT
  company_domain: Risk and Compliance
  togaf_layer: Business
  architecture_domain: Business

- actor_id: ACT-MERCHANT
  name: Merchant
  description: Accepts the card at point of sale. Reached through the scheme, never directly.
  status: Active
  actor_kind: Organization
  internal: "No"
  company_domain: Payments
  togaf_layer: Business
  architecture_domain: Business

- actor_id: ACT-CARD-SCHEME
  name: Card Scheme
  description: >
    The network carrying authorization and clearing. An external system we
    integrate with on their terms, not ours, which is why their availability is
    a design constraint rather than a requirement.
  status: Active
  actor_kind: External system
  internal: "No"
  company_domain: Payments
  togaf_layer: Business
  architecture_domain: Business

- actor_id: ACT-REGULATOR
  name: Regulator
  description: >
    Consumes periodic regulatory returns. Never integrates directly; the
    relationship is a reporting obligation with a deadline.
  status: Active
  actor_kind: Regulator
  internal: "No"
  company_domain: Risk and Compliance
  togaf_layer: Business
  architecture_domain: Governance

- actor_id: ACT-DEALER
  name: Dealer
  description: >
    A dealership selling RVs, boats and powersports vehicles that takes the
    buyer's loan application and submits it. The bank's point of sale, and a
    third party it vets, monitors and pays a reserve to.
  status: Active
  actor_kind: Organization
  internal: "No"
  company_domain: Lending
  togaf_layer: Business
  architecture_domain: Business

- actor_id: ACT-BORROWER
  name: Borrower
  description: >
    A customer repaying an installment loan: pays, asks for payoffs and
    deferrals, and gets the title back at the end.
  status: Active
  actor_kind: Person
  internal: "No"
  company_domain: Lending
  togaf_layer: Business
  architecture_domain: Business

- actor_id: ACT-FUNDING-ANALYST
  name: Funding Analyst
  description: >
    Reviews contract packages, clears stipulations and releases dealer funding.
  status: Active
  actor_kind: Role
  internal: "Yes"
  owner_org_id: ORG-LOAN-OPS
  company_domain: Lending
  togaf_layer: Business
  architecture_domain: Business

- actor_id: ACT-ISO
  name: Independent Sales Organization
  description: >
    Brings merchants to the bank and submits their applications. The bank
    sponsors those merchants into the networks and carries their liability.
  status: Active
  actor_kind: Organization
  internal: "No"
  company_domain: Payments
  togaf_layer: Business
  architecture_domain: Business

- actor_id: ACT-DEPOSITOR
  name: Depositor
  description: >
    A saver holding a CD or savings account opened directly with the bank.
  status: Active
  actor_kind: Person
  internal: "No"
  company_domain: Deposits
  togaf_layer: Business
  architecture_domain: Business

- actor_id: ACT-DEPOSIT-BROKER
  name: Deposit Broker
  description: >
    A broker-dealer that sells the bank's brokered CDs to its own customers and
    settles them through the depository.
  status: Active
  actor_kind: Organization
  internal: "No"
  company_domain: Deposits
  togaf_layer: Business
  architecture_domain: Business

- actor_id: ACT-SERVICING-CLIENT
  name: Servicing Client
  description: >
    A lender whose card portfolio the bank services under contract. Sets the
    strategies, receives the reports and audits the work.
  status: Active
  actor_kind: Organization
  internal: "No"
  company_domain: Servicing
  togaf_layer: Business
  architecture_domain: Business

- actor_id: ACT-COBRAND-PARTNER
  name: Co-Brand Partner
  description: >
    A retailer, travel brand or affinity group whose name is on the card. Shares
    the program's revenue and funds part of its rewards.
  status: Active
  actor_kind: Organization
  internal: "No"
  company_domain: Card Issuing
  togaf_layer: Business
  architecture_domain: Business

- actor_id: ACT-COLLECTION-AGENCY
  name: Collection Agency
  description: >
    Works charged-off accounts placed with it under the bank's conduct
    requirements, and remits what it collects.
  status: Active
  actor_kind: Organization
  internal: "No"
  company_domain: Collections
  togaf_layer: Business
  architecture_domain: Business

- actor_id: ACT-DEBT-BUYER
  name: Debt Buyer
  description: >
    Buys charged-off accounts in portfolio sales and takes over collecting them.
  status: Active
  actor_kind: Organization
  internal: "No"
  company_domain: Collections
  togaf_layer: Business
  architecture_domain: Business
