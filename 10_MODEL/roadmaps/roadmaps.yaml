# The roadmaps the planned estate sits on.
#
# `status` on a system says it is not live yet. It cannot say when it lands,
# what it lands with, or who is accountable for it landing, and until these
# arrived nothing in the model could. A roadmap is the initiative; the work
# packages under it are the deliveries; the change requests beside them are
# the decisions that let the work start.
#
# Quarters, not dates. The field dictionary says YYYY-Qn, and a plan written
# in a quarter that names the day is claiming precision nobody has.
#
# `time_horizon_years` is the horizon the roadmap was drawn for, which is not
# the span of what is currently scheduled on it: the regulatory program is a
# three-year commitment whose first year is the only part with work packages
# against it. If the two were always equal the field would be redundant.
#
# Every row is placeholder content drafted against a placeholder estate.

- roadmap_id: RDM-LENDING-GROWTH
  name: Consumer Lending Growth
  description: >
    Take the card business into installment lending, on the cloud landing zone
    rather than the on-premises estate, and prove the landing zone can carry a
    regulated product before anything else is asked to move onto it.
  status: Active
  togaf_layer: Business
  architecture_domain: Business
  abstraction_level: Conceptual
  company_domain: Lending
  tags: [strategic]
  owner_org_id: ORG-LENDING
  start_date: 2026-Q1
  end_date: 2028-Q1
  time_horizon_years: 1
  governance_board: Architecture Review Board
  last_reviewed: 2026-07-14

