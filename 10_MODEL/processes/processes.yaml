  business_unit: Lending
  criticality: High
  risk_level: High
  trigger: Upstream-process
  frequency: Daily
  last_reviewed: 2026-11-18
  source: Business architecture repository

- process_id: P-LENDING-008
  name: Quote payoff and release title
  description: Give the borrower or a refinancing lender a payoff quote, apply the payoff, and release the lien and send the title within the state's deadline. Late releases carry statutory penalties and complaints, and a release sent before the payoff funds clear is collateral given away.
  status: Proposed
  togaf_layer: Business
  architecture_domain: Business
  abstraction_level: Logical
  process_level: L2
  value_stream_id: VS-FINANCE-PURCHASE
