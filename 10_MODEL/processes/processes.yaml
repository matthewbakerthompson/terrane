  frequency: Real-time
  last_reviewed: 2026-11-18
  source: Business architecture repository

- process_id: P-LENDING-005
  name: Review contract package and clear stipulations
  description: Check the signed retail installment contract, the title application and the proofs of income, insurance and identity the approval was conditioned on, and send back what is missing or wrong. A contract funded with an open stipulation is a loan the bank may not be able to enforce or perfect, which is why funding waits on this review.
  status: Proposed
  togaf_layer: Business
  architecture_domain: Business
  abstraction_level: Logical
