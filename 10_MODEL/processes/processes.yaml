  business_unit: Lending
  criticality: High
  risk_level: Medium
  trigger: Scheduled
  frequency: Monthly
  last_reviewed: 2026-11-18
  source: Business architecture repository

- process_id: P-LENDING-003
  name: Receive and validate dealer-submitted application
  description: Accept a credit application keyed by the dealer's finance office, check it is complete, verify the applicant's identity and screen it for application fraud before it reaches the decision. The buyer is at the dealership, so intake runs against a point-of-sale clock; an incomplete or unverified application that slips through becomes a funding exception later.
  status: Proposed
  togaf_layer: Business
  architecture_domain: Business
  abstraction_level: Logical
  process_level: L2
  value_stream_id: VS-FINANCE-PURCHASE
  owner_org_id: ORG-DEALER-SVC
  business_unit: Lending
  criticality: High
  risk_level: High
  trigger: Customer-initiated
  frequency: Real-time
  last_reviewed: 2026-11-18
  source: Business architecture repository

- process_id: P-LENDING-004
  name: Decide indirect loan and return terms
  description: Score the application against the recreation lending credit policy, price it, and return an approval, a counteroffer with conditions, or a decline to the dealer while the buyer waits. Counteroffers and declines carry adverse action obligations, and the collateral's value sets the advance, so the decision reads the asset's value guide as well as the bureau.
  status: Proposed
  togaf_layer: Business
  architecture_domain: Business
  abstraction_level: Logical
  process_level: L2
  value_stream_id: VS-FINANCE-PURCHASE
