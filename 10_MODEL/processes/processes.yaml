  frequency: Daily
  last_reviewed: 2026-11-18
  source: Business architecture repository

- process_id: P-LENDING-009
  name: Bill installment loan and post payments
  description: Send the monthly bill, take payments by ACH, debit card, check and automatic payment, and post them to interest, principal and fees in the order the contract says. Posting drives the delinquency that collections and bureau reporting read, so a misposted payment shows up as a wrong late fee, a wrong call and a wrong bureau line.
