  criticality: High
  risk_level: High
  trigger: Upstream-process
  frequency: Daily
  last_reviewed: 2026-11-18
  source: Business architecture repository

- process_id: P-MERCHANT-004
  name: Screen merchant against sanctions and network lists
  description: Screen the business and its owners against sanctions lists and the networks' terminated-merchant file, and review prohibited and brand-damaging business types before boarding. A merchant on the terminated file, or in a prohibited category, boarded under the bank's sponsorship draws network fines on the bank.
  status: Proposed
  togaf_layer: Business
  architecture_domain: Business
  abstraction_level: Logical
  process_level: L2
  value_stream_id: VS-ENABLE-MERCHANT
