- process_id: P-LENDING-013
  name: Remarket recovered collateral and pursue deficiency
  description: Recondition and sell the recovered vehicle or boat at auction or retail, apply the proceeds, cancel the ancillary products for refund, and collect, place or sell the deficiency balance. The sale must be commercially reasonable and properly noticed, or the deficiency cannot be collected at all.
  status: Proposed
  togaf_layer: Business
  architecture_domain: Business
  abstraction_level: Logical
