  frequency: Daily
  last_reviewed: 2026-11-18
  source: Business architecture repository

- process_id: P-LENDING-006
  name: Board loan and fund dealer
  description: Create the loan on the servicing platform with its terms, payment schedule and collateral, pay the dealer the amount financed with its reserve, and post the entries. Boarding errors surface months later as wrong payment amounts or payoff quotes, and a funding paid twice or to the wrong dealer is cash out of the door.
  status: Proposed
  togaf_layer: Business
  architecture_domain: Business
  abstraction_level: Logical
  process_level: L2
  value_stream_id: VS-FINANCE-PURCHASE
