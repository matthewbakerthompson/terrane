- process_id: P-LENDING-001
  name: Recruit, vet, and contract dealer
  description: Recruit a dealer, check its licensing, ownership and complaint history, and sign the dealer agreement and program terms. A dealer takes credit applications in the bank's name, so diligence before the first application is the control that matters; an unvetted dealer is a fair lending and fraud exposure on every loan it sends.
  status: Proposed
  togaf_layer: Business
  architecture_domain: Business
  abstraction_level: Logical
  process_level: L2
  value_stream_id: VS-FINANCE-PURCHASE
  owner_org_id: ORG-DEALER-SVC
  business_unit: Lending
  criticality: High
  risk_level: Medium
  trigger: Manual
  frequency: Weekly
  last_reviewed: 2026-11-18
  source: Business architecture repository

- process_id: P-LENDING-002
  name: Monitor dealer performance and program compliance
  description: Review each dealer's volume, early payment defaults, funding exceptions, complaints and rate markup against program limits, and put dealers on watch, retrain or end them. Dealer markup is where indirect lending meets fair lending exposure, so the review evidences the markup cap as well as credit quality.
  status: Proposed
  togaf_layer: Business
  architecture_domain: Business
  abstraction_level: Logical
  process_level: L2
  value_stream_id: VS-FINANCE-PURCHASE
