  frequency: Daily
  last_reviewed: 2026-11-18
  source: Business architecture repository

- process_id: P-LENDING-007
  name: Perfect lien with titling state
  description: Record the bank as lienholder with the titling state, electronically where the state allows and on paper where it does not, and chase the title until it is in custody. An unperfected lien leaves the loan unsecured in a bankruptcy, so anything aging past the policy window is reported weekly by state and by dealer.
