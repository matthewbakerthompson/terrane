- process_id: P-CLIENTMGMT-001
  name: Qualify, price, and contract servicing client
  description: Qualify a lender that wants its card portfolio serviced, price the work from the portfolio's size and the services chosen, answer the client's own diligence of the bank, and sign the servicing agreement and service levels. The agreement sets the reporting, service levels and change process every later step is held to.
