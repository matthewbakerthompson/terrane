  trigger: Upstream-process
  frequency: Daily
  last_reviewed: 2026-11-18
  source: Business architecture repository

- process_id: P-MERCHANT-005
  name: Board merchant and register with networks
  description: Set the approved merchant up on the acquiring platform with its pricing, limits and reserve, assign merchant and terminal ids, and register it with the card networks under the bank's sponsorship. Boarding is where approved terms become system parameters, and a limit keyed wrong is exposure nobody approved.
  status: Proposed
  togaf_layer: Business
  architecture_domain: Business
  abstraction_level: Logical
  process_level: L2
  value_stream_id: VS-ENABLE-MERCHANT
  owner_org_id: ORG-MERCHANT
  business_unit: Merchant
  criticality: High
  risk_level: Medium
