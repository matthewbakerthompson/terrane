  risk_level: High
  trigger: Scheduled
  frequency: Daily
  last_reviewed: 2026-11-18
  source: Business architecture repository

- process_id: P-MERCHANT-007
  name: Set and adjust merchant reserve
  description: Set the reserve or delayed funding a merchant must carry, raise it when chargebacks, refunds or delivery risk grow, and release it when exposure ends after the merchant leaves. Reserves are held merchant money, so each change is evidenced against the merchant agreement.
