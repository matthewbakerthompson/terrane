- process_id: P-CLIENTMGMT-002
  name: Review client service levels and performance
  description: Report each client's service levels, portfolio performance and open issues, hold the monthly service review, and agree remediation and credits where a service level was missed. Missed service levels carry contractual credits, and a run of them can end a client relationship.
