- process_id: P-MERCHANT-003
  name: Underwrite merchant
  description: Assess the merchant's credit, processing history, delivery timeframes and chargeback exposure against the appetite for its business type, and approve with limits and reserve terms, or decline. Specialty and higher-risk business types are the point of the program, so underwriting sets the exposure every later step monitors.
  status: Proposed
  togaf_layer: Business
  architecture_domain: Business
  abstraction_level: Logical
  process_level: L2
  value_stream_id: VS-ENABLE-MERCHANT
