  frequency: Daily
  last_reviewed: 2026-11-18
  source: Business architecture repository

- process_id: P-MERCHANT-006
  name: Settle and fund merchants
  description: Clear the day's card volume, net out fees, chargebacks and reserve holds, and fund each merchant's bank account by ACH, reconciling network settlement to merchant funding. Funding a merchant that should have been held is exactly the loss the reserve was meant to cover.
  status: Proposed
  togaf_layer: Business
  architecture_domain: Business
  abstraction_level: Logical
  process_level: L2
  value_stream_id: VS-ENABLE-MERCHANT
  owner_org_id: ORG-SETTLEMENT
