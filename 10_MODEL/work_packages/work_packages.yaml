  description: >
    Stand up the installment lending product on the AWS landing zone: the edge
    and load balancer, the web and API tiers, the database, the object store,
    the async worker and the integration hub that fronts the ledger, the
    bureau and the CRM.
  status: Active
  togaf_layer: Application
  architecture_domain: Application
  abstraction_level: Logical
  company_domain: Lending
  tags: [cloud]
  owner_org_id: ORG-APPDEV
  roadmap_id: RDM-LENDING-GROWTH
  change_request_id: ACR-2026-014
  start_date: 2026-Q1
  end_date: 2026-Q3
  budget_usd: 4200000
  risk_level: High
  notes: >
    Ends a quarter before the product launch date so there is a quarter of
    parallel running against the card estate.

