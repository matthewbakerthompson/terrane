# What is actually being delivered, and when.
#
# A work package belongs to one roadmap through `roadmap_id`, which is a
# canonical foreign key rather than a relation table, so a view follows it
# with `via: roadmap_id` and nothing has to be kept in step. It names the
# decision that let it start the same way, through `change_request_id`.
#
# The regulatory reporting package names no decision, and that is the honest
# state rather than a gap in the data: it was funded in the planning round
# without going to the board, which is exactly the thing a change register is
# supposed to make visible.
#
# What each one touches is recorded in `10_MODEL/relations/change.yaml` as
# rows, not in the canonical `affected_system_ids` column. A semicolon list in
# a cell cannot be joined, filtered or drawn, and the estate has made that
# decision once already for `control_ids`.
#
# Between them these five account for every system in the model that is not
# live: twenty-two of them, across four products and one replacement. A planned
# system under no work package is a finding, and `change.unscheduled` reports
# it.
#
# Every row is placeholder content drafted against a placeholder estate.

