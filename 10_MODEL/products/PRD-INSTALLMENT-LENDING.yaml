# A product mid-onboarding. Everything below `archetype:` is generated by the
# AWS landing-zone shape; this file is the whole architecture change.
#
# Status is Planned throughout, so it shows up in Planned Systems and Interfaces and in the
# infrastructure views without pretending it is live yet.
product_id: PRD-INSTALLMENT-LENDING
name: Installment Lending
description: >
  Point-of-sale installment lending. New product, onboarding onto the AWS landing
  zone in eu-west-2, integrating with the existing card ledger for disbursement
  and with the warehouse for regulatory reporting.
status: Planned
owner_org_id: ORG-PRODUCT
criticality: High
product_category: Digital channel
company_domain: Lending
launch_date: 2026-11-02

build_type: digital-product
archetype: aws-product-onboarding
# Beyond the shape's: the pipeline the shape builds writes the change
# record, which is the evidence the onboarding review asks for.
patterns: [change-evidence-chain]
parameters:
  slug: lending
  product_name: Installment Lending
  owner_org: ORG-PRODUCT
  domain: Lending
  account: prod-lending
  region: eu-west-2
  criticality: High
  classification: Restricted
  resilience: Multi-AZ

overrides:
  # Credit decisioning is on the critical path for an application, so the API
  # carries the product tier rather than inheriting the default.
  SYS-LENDING-API:
    service_tier: Tier 1
  # The object store holds signed credit agreements. Seven-year retention makes
  # it a records-management concern, not just a bucket.
  SYS-LENDING-BUCKET:
    description: >
      S3 bucket holding signed credit agreements and disbursement evidence.
      Seven-year retention with Object Lock; a records-management obligation
      rather than ordinary product storage.
    criticality: High

# A part the shape does not include: the lending decision talks to the
# ledger, the bureau and the CRM through one hub rather than three pairs.
# The spokes are named here; the hub gets one interface per spoke.
#
# The two people who use it were recorded by hand in the shared
# `actors_and_flows.yaml` and are chosen here instead. Both actors already
# existed -- an applicant and an underwriter are not things this product
# invented -- so the part names them rather than creating them, and the
# product file is the whole story of the product again.
modules:
  - module: integration-hub
    with:
      spokes: [SYS-CORE-LEDGER, SYS-CREDIT-BUREAU, SYS-CRM]
  - module: operator-access
    as: applicant-access
    with:
      actor: ACT-APPLICANT
      system: SYS-LENDING-WEB
      interaction: Applies
  - module: operator-access
    as: underwriter-access
    with:
      actor: ACT-UNDERWRITER
      system: SYS-LENDING-WEB
      interaction: Reviews referrals
