# Results, images and the cancer center's own data.

- data_asset_id: DA-LAB-RESULT
  name: Laboratory results
  description: >
    Verified results from the core lab, microbiology, pathology and the
    reference lab, with reference ranges and critical flags. Leaves the LIS
    as HL7 ORU; the FHIR Observation resource on the API.
  status: Active
  togaf_layer: Data
  architecture_domain: Data
  abstraction_level: Logical
  company_domain: Diagnostics
  tags: [clinical, fhir, hl7v2]
  data_owner_org_id: ORG-LAB
  data_steward_org_id: ORG-LAB
  source_of_truth: SYS-LIS
  classification: Restricted
  risk_level: High
  pii_flag: "Yes"
  pii_types: Medical record number;Test results

