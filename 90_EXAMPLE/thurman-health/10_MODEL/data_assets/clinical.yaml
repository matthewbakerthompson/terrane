# The clinical record, as the data the estate moves around.
#
# Each asset is named for what it is to the health system, and its tags say
# which standard it travels in: `fhir` for the R4 resources the FHIR server
# serves, `hl7v2` for the feeds through the interface engine, `dicom` for
# images, `ccda` for documents exchanged with the HIE. Nearly all of it is
# protected health information, so nearly all of it is Restricted; the
# classification is the sample's four-level scale, and PHI sits at the top
# of it.

- data_asset_id: DA-PATIENT-IDENTITY
  name: Enterprise patient identity
  description: >
    Who the patient is: names, date of birth, addresses, identifiers and
    coverage, with the enterprise identifier that links every registration
    of the same person. Travels as HL7 ADT and the FHIR Patient resource.
  status: Active
  togaf_layer: Data
  architecture_domain: Data
  abstraction_level: Logical
  company_domain: Patient Access
  tags: [master, fhir, hl7v2]
  data_owner_org_id: ORG-HIM
  data_steward_org_id: ORG-HIM
  source_of_truth: SYS-EMPI
  classification: Restricted
  risk_level: High
  pii_flag: "Yes"
  pii_types: Name;Date of birth;Address;Medical record number;Member id
  quality_rules: One enterprise identifier per person; duplicate rate reviewed weekly

