# Thurman Health's capability map: nine domains and what each is made of.
#
# Written with the estate rather than imported, and kept small: two levels,
# about thirty capabilities, which is the size of map a health system's
# portfolio review is actually run against. The tiers follow the sample's
# convention (Direct delivers the care, Core runs the business of care,
# Enable keeps the lights on) and carry no more meaning here than there.
# Every capability is Proposed, as the sample's are: a straw man for a
# workshop, not a ratified map.

