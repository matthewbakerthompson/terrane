# --- shared services ---------------------------------------------------------------

# The landing zone's identity provider: the Azure digital product shape's
# web channel signs people in through whichever one that is. For the patient
# portal that is the external tenant, which is why this is one identity
# platform and not a workforce directory alone.
- tech_service_id: TS-IDENTITY
  name: Identity Platform
  description: >
    Single sign-on for the workforce -- clinicians, staff and contractors --
    and, through its external tenant, patients signing in to the portal. The
    EHR, the departmental systems and the cloud services all trust it, so
    ending a person's access is one change.
  status: Active
  togaf_layer: Technology
  architecture_domain: Technology
  company_domain: Enterprise Platform
  owner_org_id: ORG-INFOSEC
  provider: Microsoft
  service_category: Security
  service_name: Entra ID
  component_type: identity-provider
  tags: [landing-zone]
