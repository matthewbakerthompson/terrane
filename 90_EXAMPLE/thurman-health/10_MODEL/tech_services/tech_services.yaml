# Where Thurman Health runs: two data centers it owns, and an Azure landing
# zone it started three years ago for the patient-facing work.
#
# `landing-zone` says a shape or a part may resolve to a service by its kind:
# the Azure digital product shape binds "the landing zone's API gateway" and
# finds Thurman's here. The shapes used to bind the card issuer's services by
# id, and these carried its ids for that reason; they are Thurman's own
# instances, and an id is unique within an estate, not across estates.

# --- the data centers ---------------------------------------------------------

- tech_service_id: TS-ONPREM-DC
  name: Primary Data Center
  service_name: Data Center
  component_type: vpc
  description: >
    The data center beside the main hospital. The EHR, the departmental
    clinical systems and the interface engine live here, and most of what
    connects to the cloud connects back to here.
  status: Active
  provider: In-house
  service_category: Network
  owner_org_id: ORG-INFRA
  cloud_provider: On-prem
  network_zone: On-prem
  cidr: 10.20.0.0/16
  company_domain: Enterprise Platform
  togaf_layer: Technology
  architecture_domain: Technology
  tags: [landing-zone]

