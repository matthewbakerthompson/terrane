# Thurman Health's org structure: accountability, not reporting lines.
#
# Who owns what the shipped parts make when a product does not say is
# answered in `model.yaml`: Infrastructure and Cloud for the private path to
# a vendor, Data and Analytics Engineering for landed data, Information
# Security for the audit feed. The parts used to name the card issuer's org
# units there, and three of the ids below were the sample's for that reason
# alone; Information Services was `ORG-TECH` until it could be `ORG-IS`.

- org_unit_id: ORG-THURMAN
  name: Thurman Health
  description: The health system. Two hospitals, a cancer center and thirty ambulatory clinics.
  status: Active
  togaf_layer: Business
  architecture_domain: Business
  abstraction_level: Conceptual

