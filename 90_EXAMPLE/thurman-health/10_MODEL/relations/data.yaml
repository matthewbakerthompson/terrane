# What each interface carries, and which systems read and write which data.
#
# The EHR writes most of the record and the interface engine reads nearly
# all of it in passing, which is the honest shape of a hospital: the engine
# is not a system of record for anything, and it holds a copy of
# everything for as long as its queues and logs keep it.

