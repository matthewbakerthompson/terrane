# Where the estate enforces the register.
#
# The HIPAA technical safeguards land on every system holding PHI: access
# by role, the audit trail, encryption both ways. The patient safety
# controls land where the safety check actually runs -- verification in
# pharmacy, the scan in the EHR, the critical call from the lab, the
# engine's queues -- which is the question a Joint Commission surveyor
# asks of a system: show me where.
#
# Two gaps are left on purpose, as the sample leaves two. The clinical
# warehouse's pipeline and semantic layer hold a copy of nearly everything
# and record no control, which the gate says (`governance.no_control`). The
# bed board holds names and locations and records none either; it is
# Confidential, so nothing asks, which is the gap worth knowing about.

