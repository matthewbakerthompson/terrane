# The business layer joined to the estate: which system realizes which
# capability, what each stage of a value stream needs, and what each
# process touches.
#
# Workforce Identity and Access is realized by nothing on purpose. It runs
# on a technology service, not a system, and the coverage view is the
# right place to see that said rather than a placeholder system to hide it.

