# The HL7 v2 feeds, every one through the interface engine.
#
# Hub and spoke, which is how nearly every hospital is wired: a
# departmental system has one connection, to the engine, and the engine
# fans an admission out to everything that needs to know. Each feed is one
# direction of one message family, because that is how they are built,
# monitored and broken. MLLP over TLS inside the data center, so each is of
# Thurman's own `hl7v2-feed` kind (library/24_CONNECTIONS/). The nine into
# the engine go through the one listener it offers, OI-ENGINE-MLLP: one
# door, nine feeds, drawn meeting at it.

# --- out of the EHR -------------------------------------------------------------

- interface_id: INT-EHR-ENGINE-ADT
  name: EHR to Engine, ADT
  description: Admissions, discharges, transfers and registration updates, as they happen.
  status: Active
  togaf_layer: Application
  architecture_domain: Application
  company_domain: Interoperability
  source_system_id: SYS-EHR
  target_system_id: SYS-INTERFACE-ENGINE
  offered_interface_id: OI-ENGINE-MLLP
  owner_org_id: ORG-INTEGRATION
  protocol: MLLP
  direction: Outbound
  frequency: Realtime
  integration_style: Event
  auth_method: MutualTLS
  data_classification: Restricted

