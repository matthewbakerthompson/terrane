# Everything that is not an HL7 v2 feed: images, the FHIR API, the
# regional exchange, the registry, the ledger, the warehouse extracts and
# the audit trail. Each is of a shipped connection kind except the DICOM
# transfers, which are Thurman's own.

# --- images ---------------------------------------------------------------------------

- interface_id: INT-PACS-VNA-ARCHIVE
  name: PACS to Archive, studies
  description: Every study, archived once it is read.
  status: Active
  togaf_layer: Application
  architecture_domain: Application
  company_domain: Diagnostics
  source_system_id: SYS-PACS
  target_system_id: SYS-VNA
  owner_org_id: ORG-IMAGING
  protocol: DICOM
  direction: Outbound
  frequency: Realtime
  integration_style: Event
  auth_method: MutualTLS
  data_classification: Restricted

- interface_id: INT-VNA-PACS-PRIORS
  name: Archive to PACS, prior studies
  description: Prior studies fetched back the night before a scheduled exam, so the radiologist can compare.
  status: Active
  togaf_layer: Application
  architecture_domain: Application
  company_domain: Diagnostics
  source_system_id: SYS-VNA
  target_system_id: SYS-PACS
  owner_org_id: ORG-IMAGING
  protocol: DICOM
  direction: Outbound
  frequency: Realtime
  integration_style: Event
  auth_method: MutualTLS
  data_classification: Restricted

