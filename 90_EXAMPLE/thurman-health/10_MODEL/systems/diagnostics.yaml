- system_id: SYS-VNA
  name: Vendor Neutral Archive
  description: >
    The long-term image archive, in a standard format so that changing the
    PACS does not mean migrating twenty years of studies. Keeps images for
    as long as the records retention policy says.
  status: Active
  togaf_layer: Application
  architecture_domain: Application
  abstraction_level: Physical
