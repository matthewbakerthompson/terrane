# Diagnostics and oncology: the departmental systems that take an order
# from the EHR and send a result back, and the cancer center's own.

- system_id: SYS-LIS
  name: Laboratory Information System
  description: >
    Specimen tracking, the analyzers, result verification and critical-value
    calls for the core lab, microbiology and pathology. Tests it does not
    run go to the reference lab and come back through it.
  status: Active
  togaf_layer: Application
  architecture_domain: Application
  abstraction_level: Physical
  company_domain: Diagnostics
  tags: [clinical]
  owner_org_id: ORG-LAB
  criticality: High
  service_tier: Tier 1
  hosting: On-prem
  environment: Production
  provider: Licensed
  system_category: Ancillary
  data_classification_supported: Restricted
  cloud_provider: On-prem
  network_zone: On-prem
  resilience: Single-AZ

