- system_id: SYS-ONCOLOGY
  name: Oncology Information System
  description: >
    Chemotherapy regimens and cycles, infusion scheduling, and the radiation
    oncology treatment record. The cancer center works from this and the
    EHR side by side, so the two are kept in step through the interface
    engine.
