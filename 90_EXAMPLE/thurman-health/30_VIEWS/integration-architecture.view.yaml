view_id: integration-architecture
title: Integration Architecture
category: Application
section: Integration
kind: diagram
description: >
  Every system grouped by its integration role, with the protocol on each
  connection. Anything that reaches a core system without going through the
  integration and gateway layer is a point-to-point coupling.
layout: LR
node_label: name
renderers: [mermaid]

group_by: system_category

scope:
  include:
    - type: systems
      where:
        status: [Active, Planned]

edges:
  - via: interfaces
    label: protocol

style:
  color_by: criticality

limits:
  # Raised from 40 at 55 systems. Cut by id, the diagram lost the rewards,
  # point-of-sale finance and screening products whole, and the active
  # security monitoring and statements with them; what reaches a core
  # system around the gateway layer is a question about every system.
  max_nodes: 80
