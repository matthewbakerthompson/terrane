view_id: platform-dependencies
title: Platform Dependencies
category: Technology
section: Hosting
kind: report
description: >
  Which technology services each system runs on. The systems attached to a
  service are the ones affected if that service changes.
layout: TB
group_by: type
renderers: [mermaid]

scope:
  include:
    - type: tech_services
      where:
        status: [Active]
        # Network fabric has its own diagram; leaving it in here pushed this
        # view past its node cap and buried the runtime dependencies that are
        # the actual question.
        service_category: {not: [Network]}
  expand:
    - relation: system_uses_tech_service
      depth: 1
      types: [systems]

edges:
  - via: system_uses_tech_service

style:
  color_by: service_category

limits:
  # Raised from 90 when the harvested systems that plainly run on a service
  # this model holds -- the ITSM on its platform, the catalog on its --
  # were attached to it.
  max_nodes: 100
