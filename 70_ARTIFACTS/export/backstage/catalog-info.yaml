metadata:
  name: "prd-pos-finance"
  title: "Point-of-Sale Finance"
  description: "Financing offered at a retailer's checkout. The dealer or merchant starts the application in their own system, the shopper completes it on their phone, and the decision comes back before the sale closes. Built in-house on the Google Cloud landing zone, the first product to land there.\n"
  annotations:
    architecture-as-code/id: "PRD-POS-FINANCE"
spec:
  owner: "org-lending"
