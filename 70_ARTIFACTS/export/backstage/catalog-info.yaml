kind: "Domain"
metadata:
  name: "prd-ob-affordability"
  title: "Open Banking Affordability"
  description: "Affordability assessment from the shopper's own bank data, with consent, in the seconds a point-of-sale decision has. Bought rather than built; the vendor runs the open banking connections and the categorization, we send the consent and receive the assessment. Restricted from the first byte, so the path to the vendor is private.\n"
  annotations:
    architecture-as-code/id: "PRD-OB-AFFORDABILITY"
spec:
  owner: "org-lending"
