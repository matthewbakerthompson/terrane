metadata:
  name: "prd-rewards"
  title: "Rewards Redemption"
  description: "Cardholders browse the rewards catalog and redeem points for statement credit, gift cards and merchandise. Built in-house on the Azure landing zone; a redemption is confirmed in the response and fulfilled afterward by a worker consuming the product's own events.\n"
  annotations:
    architecture-as-code/id: "PRD-REWARDS"
spec:
  owner: "org-rewards"
