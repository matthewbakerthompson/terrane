<text x="1072" y="50" font-size="12" font-weight="400" fill="#495366" font-family="Geist Mono, ui-monospace, monospace" text-anchor="end">Architecture Model   ·   5 nodes · 8 edges</text>
<text x="28" y="78" font-size="14" font-weight="400" fill="#343d50">One system and everything that governs it: the controls it enforces, the policies it is subject to, and the controls that apply through the capabilities it realizes. A</text>
<text x="28" y="98" font-size="14" font-weight="400" fill="#343d50">control reached only through a capability means either the system enforces it and nobody recorded that, or it is enforced somewhere else.</text>
