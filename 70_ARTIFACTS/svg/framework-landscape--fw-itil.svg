<text x="1220" y="50" font-size="12" font-weight="400" fill="#495366" font-family="Geist Mono, ui-monospace, monospace" text-anchor="end">Architecture Model   ·   21 capabilities · 14 groups</text>
<text x="28" y="78" font-size="14" font-weight="400" fill="#343d50">The capabilities placed in one framework, laid out in the framework's own terms: BIAN's business areas and domains, ITIL's groups of practices, the CRI Profile's functions. It is drawn for</text>
<text x="28" y="98" font-size="14" font-weight="400" fill="#343d50">every framework something is placed in, including one an organization adds. A capability placed twice in one framework is drawn at its first placement, and its details list every one.</text>
