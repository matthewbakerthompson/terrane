<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="657" viewBox="0 0 1100 657" font-family="Geist, system-ui, sans-serif" data-layout="elk">
<title>Authorization Switch — Governance</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<g class="head"><text x="28" y="52" font-size="24" font-weight="600" fill="#101828">Authorization Switch — Governance</text>
<text x="1072" y="50" font-size="12" font-weight="400" fill="#495366" font-family="Geist Mono, ui-monospace, monospace" text-anchor="end">Architecture Model   ·   10 nodes · 12 edges</text>
<text x="28" y="78" font-size="14" font-weight="400" fill="#343d50">One system and everything that governs it: the controls it enforces, the policies it is subject to, and the controls that apply through the capabilities it realizes. A</text>
<text x="28" y="98" font-size="14" font-weight="400" fill="#343d50">control reached only through a capability means either the system enforces it and nobody recorded that, or it is enforced somewhere else.</text>
