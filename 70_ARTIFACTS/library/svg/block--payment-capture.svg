<text x="1072" y="50" font-size="12" font-weight="400" fill="#495366" font-family="Geist Mono, ui-monospace, monospace" text-anchor="end">Architecture Model   ·   4 nodes · 3 edges</text>
<text x="28" y="78" font-size="14" font-weight="400" fill="#343d50">A gateway for the channels that call, a file transfer for the channels that send batches, a queue that makes both one ordered stream of instructions, and the store</text>
<text x="28" y="98" font-size="14" font-weight="400" fill="#343d50">that remembers every instruction until the ledger has acknowledged it. The queue is the pattern's whole point: posting is idempotent only if something upstream of</text>
<text x="28" y="118" font-size="14" font-weight="400" fill="#343d50">the ledger owns the sequence.</text>
