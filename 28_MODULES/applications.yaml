# The standard applications: kits of the components in application-parts.yaml
# and product-parts.yaml.
#
# A kit is a part made of parts. Picking one in the Assemble panel picks its
# members, each under its own name, so a product can still do without one of
# them, tell one of them something, or add a part the kit did not bring. The
# application types in 29_TYPES/ require these: an internal tool is the
# internal-tool kit plus whatever it offers. Nothing here names a cloud; the
# members name blocks and kinds, and the landing zone answers.

- module_id: web-app-baseline
  name: Web application
  category: Application
  optional: true
  description: >
    The standard web application: a browser front end behind the public
    front door, the API behind it, and the operational database. The parts
    every one of these starts with, picked in one go.
  modules:
    - module: api-service
    - module: web-channel
    - module: public-web-entry
    - module: relational-datastore

- module_id: mobile-app-baseline
  name: Mobile application
  category: Application
  optional: true
  description: >
    The standard mobile application: the app in the stores, the API it calls
    through the shared gateway, and the operational database.
  modules:
    - module: api-service
    - module: mobile-channel
    - module: relational-datastore

- module_id: internal-tool-baseline
  name: Internal tool
  category: Application
  optional: true
  description: >
    The standard internal tool: a console behind workforce sign-on, the API
    behind it, and the operational database. No public front door.
  modules:
    - module: api-service
    - module: admin-console
    - module: relational-datastore

- module_id: event-service-baseline
  name: Event-driven service
  category: Application
  optional: true
  description: >
    The standard event-driven service: consumes another system's events,
    does the work in a worker, and publishes its own events for whoever is
    next. An API for whatever still has to be asked directly.
  parameters:
    - name: source_system
      required: true
      ask: Consumes the events of
      names: systems
      description: The system whose events the service consumes.
  modules:
    - module: api-service
    - module: event-consumer
      with:
        source_system: "{source_system}"
    - module: async-worker
    - module: event-publisher

- module_id: batch-app-baseline
  name: Batch application
  category: Application
  optional: true
  description: >
    The standard batch application: scheduled jobs with a window, the API
    they call, and the operational database they work over.
  modules:
    - module: api-service
    - module: scheduled-job
    - module: relational-datastore

- module_id: adapter-baseline
  name: Integration adapter
  category: Application
  optional: true
  description: >
    The standard integration with a partner system: an adapter that owns the
    mapping, retry and credentials, and the API it serves.
  parameters:
    - name: partner
      required: true
      ask: Partner
      description: Who is on the other end, by name.
    - name: target_system
      required: true
      ask: The partner's system
      names: systems
      description: Where the partner's end is in the model.
  modules:
    - module: api-service
    - module: partner-adapter
      with:
        partner: "{partner}"
        target_system: "{target_system}"

- module_id: ml-service-baseline
  name: AI inference service
  category: Application
  optional: true
  description: >
    The standard AI service: an inference service that calls the landing
    zone's foundation model service, with prompts, retrieval, guardrails and
    the audit log in one place, and the API in front of it.
  modules:
    - module: api-service
    - module: ml-inference-service

- module_id: ai-assistant-baseline
  name: AI assistant
  category: Application
  optional: true
  description: >
    The standard AI assistant, built: a chat behind workforce sign-on, the
    API behind it, the inference service that assembles each prompt and
    calls the landing zone's foundation model through its AI gateway, the
    retrieval index the organization's documents are loaded into, and the
    history of what was asked and answered. One component on the canvas,
    and never one box: an assistant bought whole is a vendor, on the vendor
    shapes.
  parameters:
    - name: sources
      default: []
      ask: Answers from
      names: systems
      description: Their documents are embedded into the retrieval index, each a daily feed.
  modules:
    - module: api-service
    - module: assistant-chat
    - module: ml-inference-service
    - module: retrieval-index
      with:
        sources: "{sources}"
    - module: conversation-history

- module_id: ai-agent-baseline
  name: AI agent
  category: Application
  optional: true
  description: >
    The standard AI agent: the API work is asked of, and an agent on the
    landing zone's agent platform that plans with its model through its AI
    gateway and acts through the APIs of the systems it is given as tools,
    every action written to its action log first. The tools are named on
    the product.
  parameters:
    - name: tools
      default: []
      ask: Acts through
      names: systems
      description: It calls their APIs, every action written to its action log first.
  modules:
    - module: api-service
    - module: agent-service
      with:
        tools: "{tools}"

- module_id: customer-portal-baseline
  name: Customer portal
  category: Application
  optional: true
  description: >
    The standard customer portal: a web front end behind the public front
    door that customers sign in to with accounts of their own, the API
    behind it, the operational database, and the notifications it sends
    them. What a customer-facing web application becomes once it has
    customers who log in.
  modules:
    - module: api-service
    - module: web-channel
    - module: public-web-entry
    - module: customer-sign-in
    - module: relational-datastore
    - module: notification-service

- module_id: partner-api-baseline
  name: Partner API
  category: Application
  optional: true
  description: >
    The standard API offered to partners: the service and its database,
    published through the landing zone's API gateway, each partner a client
    with its own credentials and quota. The partners are named on the
    product, and each gets a line of its own to the API.
  parameters:
    - name: partners
      default: []
      ask: Called by
      names: systems
      description: The partners' systems, each a client of the gateway with its own credentials.
  modules:
    - module: api-service
    - module: partner-api
      with:
        partners: "{partners}"
    - module: relational-datastore

- module_id: reporting-baseline
  name: Reporting application
  category: Application
  optional: true
  description: >
    The standard reporting application: reports and extracts over an
    operational database, behind an API, and never in the transaction path.
  modules:
    - module: api-service
    - module: relational-datastore
    - module: report-service
